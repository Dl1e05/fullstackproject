server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # service worker не должен кэшироваться, иначе обновления не доедут до пользователей
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA: любые маршруты отдают index.html
  location / {
    try_files $uri /index.html;
  }
}
