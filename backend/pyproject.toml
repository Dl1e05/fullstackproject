[project]
name = "shag-backend"
version = "0.1.0"
description = "API платформы коротких онлайн-курсов «Шаг»"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
per-file-ignores = { "alembic/env.py" = ["E402"], "alembic/versions/*" = ["E501"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
